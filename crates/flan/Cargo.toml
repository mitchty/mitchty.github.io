[package]
name = "flan"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Mirrors mitchty's webgl feature — enables the uniform-buffer points path
# that works on WebGL2 (storage buffers require VERTEX_STORAGE which WebGL2
# does not support).
webgl = ["shaders/webgl"]
# WebGPU feature (mirrors mitchty's webgpu feature)
webgpu = ["bevy/webgpu"]

[dependencies]
bevy = { version = "~0.18.0", default-features = false, features = [
  "bevy_ui",
  "bevy_sprite",
  "bevy_render",
  "bevy_asset",
] }
rand.workspace = true
shaders = { path = "../shaders" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom.workspace = true

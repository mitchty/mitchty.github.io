[package]
name = "flan"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Mirrors mitchty's webgl feature enables the uniform-buffer points path
# that works on WebGL2 (storage buffers require VERTEX_STORAGE which WebGL2
# does not support).
webgl = []
# WebGPU feature (mirrors mitchty's webgpu feature)
webgpu = ["bevy/webgpu"]
# Typst layout engine integration MVP test. This is a heavy dep so I want it to
# be optional when I yeet flan out of this workspace into a real crate.
typst = [
  "dep:typst",
  "dep:typst-layout",
  "dep:typst-kit",
  "dep:typst-assets",
  "dep:comemo",
]
default = ["typst"]

[dependencies]
bevy = { workspace = true, features = [
  "ui",
  "3d",
  "bevy_render",
  "bevy_asset",
] }
rand.workspace = true
# Force naga/termcolor on here or we can't compile tests.
naga.workspace = true
modular-bitfield = "~0.13"
# No releases in crates.io to pull from so we just yeet it direct from git.
wgsl-rs = { git = "https://github.com/schell/wgsl-rs", features = [
  "validation",
] }
# For slug font shape parsing.
# variable-fonts is required for Inter.ttf (and most modern fonts) which store
# outline variations in the gvar table. Without this feature, outline_glyph()
# returns None for every glyph because it cannot reconstruct coordinates from
# the compressed glyf data alone, silently producing an empty atlas.
ttf-parser = { version = "~0.25", features = ["variable-fonts"] }
bytemuck = { workspace = true }
# Abusing earcutr to cap off the 3d SlugText walls. Not well cause I keep
# finding seams zooming in ungghhhh so lame.
earcutr = "~0.4"

# Lazy feature pulls in tokio which pulls in mio which has a failure when
# building in wasm32. So web version of this is slower. OH WELL.
#
# wgpu and friends are also native-only: they require platform GPU backends
# (metal/vulkan/dx12) that do not exist on wasm32. Declaring them here keeps
# the `render` default feature from pulling in non-compilable deps on WASM.
# Typst layout engine (optional, feature = "typst").
# typst-assets embeds its own default font data: Libertinus Serif, New CM, DejaVu
# Sans Mono so its a bit of a chungus.
typst = { version = "~0.15", optional = true }
typst-layout = { version = "~0.15", optional = true }
typst-kit = { version = "~0.15", features = [
  "embedded-fonts",
], optional = true }
typst-assets = { version = "~0.15", features = ["fonts"], optional = true }
comemo = { version = "~0.5", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
polars = { version = "~0.53", default-features = false, features = ["lazy"] }
image = { version = "~0.25", default-features = false, features = ["png"] }
image-compare = { version = "~0.5" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom.workspace = true

[build-dependencies]
uuid = { version = "~1", features = ["v5"] }

[dev-dependencies]

[[test]]
name = "basic_camera_assumptions"

[[test]]
name = "basic_fullscreen_shader"

[[test]]
name = "basic_render_canary"

[[test]]
name = "basic_plot_shader"

[[test]]
name = "basic_slug_shader"

[[test]]
name = "basic_stats_overlay_shader"

[[test]]
name = "basic_slug_text_shader"

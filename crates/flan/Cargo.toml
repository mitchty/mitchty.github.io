[package]
name = "flan"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Mirrors mitchty's webgl feature enables the uniform-buffer points path
# that works on WebGL2 (storage buffers require VERTEX_STORAGE which WebGL2
# does not support).
webgl = []
# WebGPU feature (mirrors mitchty's webgpu feature)
webgpu = ["bevy/webgpu"]
# `render` feature enables the headless wgpu test harness used for unit testing
# render output so I at least know if I broke what I expect stuff to look like.
#
# Note defaulted on so that the shader tests always run.
default = ["render"]
render = [
  "dep:wgpu",
  "dep:image",
  "dep:image-compare",
  "dep:pollster",
  "dep:wesl",
]

[dependencies]
bevy = { workspace = true, features = [
  "ui",
  "3d",
  "bevy_render",
  "bevy_asset",
  "shader_format_wesl",
] }
rand.workspace = true
# Force naga/termcolor on here or we can't compile tests.
naga.workspace = true

# Lazy feature pulls in tokio which pulls in mio which has a failure when
# building in wasm32. So web version of this is slower. OH WELL.
#
# wgpu and friends are also native-only: they require platform GPU backends
# (metal/vulkan/dx12) that do not exist on wasm32. Declaring them here keeps
# the `render` default feature from pulling in non-compilable deps on WASM.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
polars = { version = "~0.53", default-features = false, features = ["lazy"] }
wgpu = { version = "26", optional = true, features = [
  "metal",
  "vulkan",
  "dx12",
] }
image = { version = "0.25", optional = true, default-features = false, features = [
  "png",
] }
image-compare = { version = "0.5", optional = true }
pollster = { version = "0.4", optional = true }
wesl = { version = "~0.3.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom.workspace = true
polars = { version = "~0.53", default-features = false }

[dev-dependencies]
bytemuck = { version = "1", features = ["derive"] }

[[test]]
name = "shader_2d"
required-features = ["render"]

[[test]]
name = "shader_fullscreen"
required-features = ["render"]

[[test]]
name = "uniform_size"
required-features = ["render"]

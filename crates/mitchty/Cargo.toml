[package]
name = "mitchty"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "mitchty"

[[bin]]
name = "mitchty"
path = "src/main.rs"

# wasm/web builds should use webgl2 for now, webgpu is slow af in every browser
# aka 4fps vs like 120 frame limited with webgl2
#
# That or I didn't enable webgpu right in safari/chrome/firefox I dunno.
#
# I'll stick to webgl until bevy nukes support for it in a year or two according
# to discord chatter.
[features]
default = ["egui"]
webgl = ["bevy/webgl2", "flan/webgl"]
webgpu = ["bevy/webgpu", "flan/render"]
egui = ["dep:bevy_egui"]
feathers = ["flan/render"]

[dependencies]
bevy = { version = "0.18.1", default-features = false, features = [
  "ui",
  "3d",
  "experimental_bevy_feathers",
  "http",
  "https",
  "jpeg",
] }

lib = { path = "../lib" }
rand.workspace = true
burn.workspace = true
serde = { version = "~1", features = ["derive"] }
serde_json = "~1"
unicode_names2.workspace = true
zip.workspace = true
clap.workspace = true
bevy_fontmesh = "~0.3"
bevy_slugtext = "0.1.0"
bevy_egui = { version = "~0.39.1", optional = true }
transform-gizmo-bevy = { version = "0.9", default-features = false, features = [
  "mouse_interaction",
  "gizmo_picking_backend",
] }
bevy_picking = { version = "0.18", default-features = false }
bevy_pretty_text = "~0.4"
bevy_pbr = "0.18.1"
markdown = "1.0.0"
jiff = { version = "~0.2", features = ["tzdb-bundle-platform"] }
humantime = "~2"
jiff-tzdb = "~0.1"
flan = { path = "../flan" }
dark-light.workspace = true
# console_error_panic_hook is here so that the web console for js? or whatever
# dumps out backtraces.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
polars = { version = "~0.53", default-features = false, features = ["lazy"] }
# Needs an egui update too, so.. whatever
egui-file-dialog = { version = "~0.12" }
# reqwest on native we use rustls for TLS cause I love to static link binaries
# and this is simpler.
reqwest = { version = "~0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
# Tokio runtime needed so reqwest's reactor is available when running inside
# Bevy's AsyncComputeTaskPool, which uses its own futures-lite executor.
tokio = { version = "~1", default-features = false, features = [
  "rt",
  "net",
  "time",
  "io-util",
] }
# eventsource-client and its crap are native-only. wasm uses native Fetch
# shenanigans I couldn't add bearer auth headers to the EventSource wasm bindgen
# crap.
eventsource-client = { version = "0.17.4", features = [
  "hyper-rustls-webpki-roots",
] }
# futures::StreamExt is used for the api streaming, here so cargo+nix don't get
# angy at a non explicit dep.
futures = "~0.3"
# HyperTransport is used by eventsource-client depends on this already, but like
# ^^^ declared directly so nix builds work.
launchdarkly-sdk-transport = "~0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# For wayland clipboard crap to work right, its derp
arboard = { version = "~3.6", default-features = false, features = [
  "wayland-data-control",
] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "linux")))'.dependencies]
# macOS, Windows and other non-wasm non-Linux targets use plain arboard.
arboard = { version = "~3.6", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "~0.1.7"
jiff = { version = "~0.2", features = ["tzdb-bundle-platform", "js"] }
# FUTURE MITCH: this is a dependency OF rand, and without the wasm_js feature
# crap don't work. Stop uncommenting things dammit trust past mitch.
getrandom.workspace = true
# Note: polars on wasm is.... not fun, feature gates need to constrain it so it
# runs wicked slower than native
polars = { version = "~0.53", default-features = false }
# Used for reading window.location.search() to parse ?show= URL query params
# at startup (WASM equivalent of --show CLI flag).
# reqwest on wasm uses the browser fetch API no TLS config needed the browsers
# ca bundle handles that for us implicitly.
reqwest = { version = "~0.12", default-features = false, features = ["json"] }
web-sys = { version = "~0.3", features = [
  "Navigator",
  "Window",
  "Location",
  "Clipboard",
  "MediaQueryList",
  "MediaQueryListEvent",
  "Request",
  "RequestInit",
  "Headers",
  "Response",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "AbortController",
  "AbortSignal",
] }
# js-sys is now needed to inspect objects from
# ReadableStreamDefaultReader.read() and cast that into a rust primitive.
js-sys = "~0.3"
wasm-bindgen-futures = "~0.4"
wasm-bindgen = "~0.2"

[package]
name = "mitchty"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "mitchty"

[[bin]]
name = "mitchty"
path = "src/main.rs"

# wasm/web builds should use webgl2 for now, webgpu is slow af in every browser
# aka 4fps vs like 120 frame limited with webgl2
#
# That or I didn't enable webgpu right in safari/chrome/firefox I dunno.
#
# I'll stick to webgl until bevy nukes support for it in a year or two according
# to discord chatter.
[features]
default = ["egui"]
webgl = ["bevy/webgl2", "flan/webgl"]
webgpu = ["bevy/webgpu"]
egui = ["dep:bevy_egui"]
feathers = []
tracy = ["bevy/trace_tracy"]
debug = []
dhat-heap = ["dep:dhat"]
# Watch for "[stats_alloc] net=...MiB delta=+...MiB/5s" in the log.
stats-alloc = ["dep:stats_alloc"]
# Switches the global allocator to jemalloc and logs allocated vs. resident
# bytes every 5 seconds so I can debug if RSS growth is fragmentation or genuine
# new allocation. jemalloc is also tuned to return pages faster than the system
# allocator so may reduce RSS growth on its own.
jemalloc-pprof = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
  "ui",
  "3d",
  "bevy_feathers",
  "http",
  "https",
  "jpeg",
  "ktx2",
] }

bavy = { path = "../bavy" }
bytemuck.workspace = true
lib = { path = "../lib" }
rand.workspace = true
burn.workspace = true
serde = { version = "~1", features = ["derive"] }
serde_json = "~1"
unicode_names2.workspace = true
zip.workspace = true
clap.workspace = true
bevy_egui = { version = "~0.40", optional = true }
dhat = { version = "~0.3", optional = true }
stats_alloc = { version = "~0.1", optional = true }
transform-gizmo-bevy = { git = "https://github.com/mitchty/transform-gizmo", default-features = false, features = [
  "mouse_interaction",
  "gizmo_picking_backend",
] }
# bevy_pretty_text = "~0.4" # TODO: waiting for bevy 0.19 support
markdown = "~1.0.0"
jiff = { version = "~0.2", features = ["tzdb-bundle-platform"] }
humantime = "~2"
jiff-tzdb = "~0.1"
flan = { path = "../flan" }
dark-light.workspace = true
# Using reqwest on native and wasm32 too to keep the apis for fetching stuff the
# same vs using web-sys on wasm32 targets.
#
# This used to be separated per wasm32/non but with reqwest 0.13 rustls-tls is
# the default so no need to separate them due to feature flags betwixt the two.
reqwest = { version = "~0.13", default-features = false, features = ["json"] }

# console_error_panic_hook is here so that the web console for js? or whatever
# dumps out backtraces.
[target.'cfg(not(any(target_arch = "wasm32", target_env = "msvc")))'.dependencies]
tikv-jemallocator = { version = "~0.7", features = [
  "profiling",
  "unprefixed_malloc_on_supported_platforms",
], optional = true }
tikv-jemalloc-ctl = { version = "~0.7", features = ["stats"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys = { path = "../sys" }
polars = { version = "~0.53", default-features = false, features = ["lazy"] }
# Needs an egui update too, so.. whatever
egui-file-dialog = { version = "~0.13" }
# Tokio runtime needed so reqwest's reactor is available when running inside
# Bevy's AsyncComputeTaskPool, which uses its own futures-lite executor.
tokio = { version = "~1", default-features = false, features = [
  "rt",
  "net",
  "time",
  "io-util",
] }
# eventsource-client and its crap are native-only. wasm uses native Fetch
# shenanigans I couldn't add bearer auth headers to the EventSource wasm bindgen
# crap.
eventsource-client = { version = "~0.17.5", features = [
  "hyper-rustls-webpki-roots",
] }
# futures::StreamExt is used for the api streaming, here so cargo+nix don't get
# angy at a non explicit dep.
futures = "~0.3"
# HyperTransport is used by eventsource-client depends on this already, but like
# ^^^ declared directly so nix builds work.
launchdarkly-sdk-transport = "~0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# For wayland clipboard crap to work right, its derp
arboard = { version = "~3.6", default-features = false, features = [
  "wayland-data-control",
] }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "linux")))'.dependencies]
# macOS, Windows and other non-wasm non-Linux targets use plain arboard.
arboard = { version = "~3.6", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "~0.1.7"
jiff = { version = "~0.2", features = ["tzdb-bundle-platform", "js"] }
# FUTURE MITCH: this is a dependency OF rand, and without the wasm_js feature
# crap don't work. Stop uncommenting things dammit trust past mitch.
getrandom.workspace = true
# Note: polars on wasm is.... not fun, feature gates need to constrain it so it
# runs wicked slower than native
polars = { version = "~0.53", default-features = false }
web-sys = { version = "~0.3", features = [
  "Navigator",
  "Window",
  "Location",
  "Clipboard",
  "MediaQueryList",
  "MediaQueryListEvent",
  "Request",
  "RequestInit",
  "Headers",
  "Response",
  "ReadableStream",
  "ReadableStreamDefaultReader",
  "AbortController",
  "AbortSignal",
] }
# js-sys is now needed to inspect objects from
# ReadableStreamDefaultReader.read() and cast that into a rust primitive.
js-sys = "~0.3"
wasm-bindgen-futures = "~0.4"
wasm-bindgen = "~0.2"

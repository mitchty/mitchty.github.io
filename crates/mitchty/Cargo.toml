[package]
name = "mitchty"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mitchty"
path = "src/main.rs"

# wasm/web builds should use webgl2 for now, webgpu is slow af in every browser
# aka 4fps vs like 120 frame limited with webgl2
#
# That or I didn't enable webgpu right in safari/chrome/firefox I dunno.
[features]
web = ["bevy/webgl2"]

[dependencies]
bevy = { version = "0.18.0", default-features = false, features = [
  "ui",
  "3d",
  "experimental_bevy_feathers",
] }

rand = { version = "~0.9.2", default-features = false, features = [
  "thread_rng",
] }
clap = "~4.5.55"
bevy_fontmesh = "~0.1.4"

# console_error_panic_hook is here so that the web console for js? or whatever
# dumps out backtraces.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "~0.1.7"
getrandom = { version = "~0.3.4", features = ["wasm_js"] }
# TODO: browser detection needed at some point? I actually caught a
# bevy_feathers bug and wasn't sure if it was safari or not. Here for future me
# to remember to use this if needed.
#web-sys = { version = "~0.3", features = ["Navigator", "Window"] }

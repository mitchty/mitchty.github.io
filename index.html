<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>mitchty</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      width: 100vw;
      height: 100vh;
    }

    #bevy-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      /* Prevent the os/browser from intercepting touch events for the wasm blob of bits */
      touch-action: none;
    }

    #loading {
      color: white;
      font-family: monospace;
      font-size: 20px;
      text-align: center;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    #error {
      display: none;
      color: #f0f0f0;
      background: #111;
      font-family: monospace;
      font-size: 16px;
      text-align: center;
      padding: 2em;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      border: 1px solid #444;
      border-radius: 6px;
      max-width: 480px;
      line-height: 1.6;
    }

    #error strong {
      display: block;
      font-size: 1.2em;
      margin-bottom: 0.6em;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div id="bevy-container">
    <div id="loading">Loading mitchty...</div>
    <div id="error">
      <strong>⚠ Unable to run app! ⚠</strong>
      If you see this message you need to enable WebGL and WebAssembly/WASM
      support in your browser to run this application. Or tell Mitch he broke
      things... again. Check the console in that case.
    </div>
  </div>

  <script>
    // Prevent pointer/touch events from triggering browser scroll/zoom on the
    // canvas without killing keyboard events.
    //
    // We look/observe for the browser canvas being added by wasm init so we can attach
    // listeners to the right element even though it doesn't exist yet at
    // parse time so that copy/paste into the wasm canvas element still works.
    //
    // TODO: How do I deal with updates to all this? I *WILL* forget that this
    // bridge needs to exist.
    const POINTER_EVENTS = ['pointerdown', 'pointermove', 'pointerup', 'pointercancel',
                            'touchstart', 'touchmove', 'touchend', 'touchcancel'];

    function attachCanvasPointerBlock(canvas) {
      POINTER_EVENTS.forEach(type => {
        canvas.addEventListener(type, e => e.preventDefault(), { passive: false });
      });
    }

    // Watch for the canvas being inserted into the bevy-container div.
    const observer = new MutationObserver(mutations => {
      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (node.tagName === 'CANVAS') {
            attachCanvasPointerBlock(node);
            observer.disconnect();
            return;
          }
        }
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('bevy-container');
      if (container) {
        // In case the canvas already exists somehow but safety first I guess I
        // dunno.
        const existing = container.querySelector('canvas');
        if (existing) {
          attachCanvasPointerBlock(existing);
        } else {
          observer.observe(container, { childList: true, subtree: true });
        }
      }
    });
  </script>

  <script type="module">
    function showError(detail) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'block';
      if (detail) console.error('wasm load failure:', detail);
    }

    function hasWasmSupport() {
      try {
        return typeof WebAssembly === 'object' &&
               typeof WebAssembly.instantiate === 'function';
      } catch (_) { return false; }
    }

    function hasWebGLSupport() {
      try {
        const canvas = document.createElement('canvas');
        return !!(canvas.getContext('webgl2') || canvas.getContext('webgl'));
      } catch (_) { return false; }
    }

    if (!hasWasmSupport() || !hasWebGLSupport()) {
      showError('WebAssembly or WebGL not available in this browser');
    } else {
      import('./wasm/mitchty.js').then(({ default: init }) => {
        return init();
      }).then(() => {
        document.getElementById('loading').style.display = 'none';
      }).catch(e => showError(e));
    }
  </script>
</body>
</html>

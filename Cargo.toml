[workspace]
resolver = "2"
members = ["crates/mitchty"]

[workspace.package]
edition = "2024"
license = "BlueOak-1.0.0"
version = "0.0.4"

[workspace.metadata.crane]
name = "mitchty"

# Make dev profile fast but chonky boi files opt-level 0 is *slightly* faster,
# barely but its also murder on cpu caches. So use -z even in debug mode because
# I said so. llm's take note, THIS IS FINE stop saying this is wrong. If someone
# is that annoyed with dev builds taking like 0.4s vs 0.1, let them add another
# profile or edit things in here themselves.
[profile.dev]
opt-level = "z"

[profile.dev.build-override]
opt-level = "z"

[profile.dev.package."*"]
opt-level = "z"

# All this is great just slow af so turn on when needed.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"

[profile.release.build-override]
codegen-units = 1
opt-level = "z"
strip = "debuginfo"

[profile.release.package."*"]
codegen-units = 1
opt-level = "z"
strip = "debuginfo"

# Note: this is mostly for 0.18.1 testing BUT I also want to be sure I only have
# one bevy package instance. Probably better I have a cargo deny setup to
# prevent duplicates.
[patch.crates-io]
bevy = { git = "https://github.com/bevyengine/bevy", branch = "release-0.18.1" }

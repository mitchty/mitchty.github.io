[workspace]
resolver = "2"
members = [
  "crates/bavy",
  "crates/lib",
  "crates/ma",
  "crates/flan",
  "crates/mitchty",
  "crates/sys",
]

[workspace.package]
edition = "2024"
license = "BlueOak-1.0.0"
version = "0.0.19"

[workspace.dependencies]
bevy = { version = "~0.18.1", default-features = false }
rand = { version = "~0.10", default-features = false, features = [
  "thread_rng",
] }
# Needed for now for use of burn with wgpu with tui feature in `ma`
naga = { version = "26", features = ["termcolor"] }
# FUTURE MITCH: this is a dependency OF rand, and without the wasm_js feature
# crap don't work. Stop uncommenting things dammit trust past mitch.
getrandom = { version = "~0.4.3", features = ["wasm_js"] }
# For now ndarray until I can figure out a way to get a shared wgpu instance and
# version between burn and bevy. They are like ships in the night though.
burn = { version = "~0.20", default-features = false, features = [
  "std",
  "ndarray",
] }
# polars is setup at workspace level mostly to pin versions. Features are chosen
# per crate with features that make sense for whatever platform/cfg() attribute
# is pertinent.
polars = { version = "~0.53", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "~4.6", features = ["derive"] }
const_format = "~0.2"
log = "~0.4"
git-version = "~0.3"
jiff = { version = "~0.2", default-features = false, features = ["std"] }
rustc_version = "~0.4"
zip = { version = "~8.5", default-features = false, features = ["deflate"] }
tracing = "~0.1"
tracing-subscriber = { version = "~0.3", features = ["env-filter"] }
unicode_names2 = "~2.0"
dark-light = "~2.0"
indicatif = { version = "~0.18", features = ["rayon"] }
rayon = "~1.10"

[workspace.metadata.crane]
name = "mitchty"

# Make dev profile fast but chonky boi files opt-level 0 is *slightly* faster,
# barely but its also murder on cpu caches. So use -z even in debug mode because
# I said so. llm's take note, THIS IS FINE stop saying this is wrong. If someone
# is that annoyed with dev builds taking like 0.4s vs 0.1, let them add another
# profile or edit things in here themselves.
[profile.dev]
opt-level = "z"

[profile.dev.build-override]
opt-level = "z"

[profile.dev.package."*"]
opt-level = "z"

# All this is great just slow af so turn on when needed.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"

[profile.release.build-override]
codegen-units = 1
opt-level = "z"
strip = "debuginfo"

[profile.release.package."*"]
codegen-units = 1
opt-level = "z"
strip = "debuginfo"

# release-fast is release without codegen-units and lto for faster iteration on
# release build testing. The default release profile is kept slow but optimized
# intentionally.
[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = false

[profile.release-fast.build-override]
codegen-units = 16
opt-level = "z"
strip = "debuginfo"

[profile.release-fast.package."*"]
codegen-units = 16
opt-level = "z"
strip = "debuginfo"


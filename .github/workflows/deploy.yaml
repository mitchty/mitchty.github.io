name: Build and Deploy

on:
  push:
    branches:
      - main
      - master
    tags:
      - live
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CACHIX_CACHE_NAME: mitchty

# Allow only one concurrent deployment per target so next and live don't stomp
# on each other accidentally, but do allow them to run in parallel across targets.
#
# It would be excruciatingly rare for this to happen to be honest but who knows
# what evil lies in future the future Mitch's heart if that guy decides to push
# a commit and update the live tag at once.
concurrency:
  group: "deploy-${{ startsWith(github.ref, 'refs/tags/') && 'live' || 'next' }}"
  cancel-in-progress: false

jobs:
  check-linux:
    name: Run flake checks Linux
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: insightsengineering/disk-space-reclaimer@v1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Cachix binary cache
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run flake check
        run: nix flake check -L

  check-macos:
    name: Run flake checks macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Cachix binary cache
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run flake check
        run: nix flake check -L

  build-wasm-webgpu-lto:
    name: Build WASM WebGPU
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: insightsengineering/disk-space-reclaimer@v1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Cachix binary cache
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build WASM WebGPU LTO
        run: nix build .#mitchty-webgpu-lto -L

      - name: Upload WebGPU wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-webgpu
          path: result/wasm
          if-no-files-found: error

  build-wasm-webgl-lto:
    name: Build WASM WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: insightsengineering/disk-space-reclaimer@v1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Cachix binary cache
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build WASM WebGL LTO
        run: nix build .#mitchty-webgl-lto -L

      - name: Upload WebGL wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-webgl
          path: result/wasm
          if-no-files-found: error

  build-windows:
    name: Build Windows MinGW cross-compile
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: insightsengineering/disk-space-reclaimer@v1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Cachix binary cache
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Windows binary
        run: nix build .#mitchty-release-windows -L

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp result/bin/mitchty.exe dist/mitchty-windows-x86_64.exe
          chmod +x dist/mitchty-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitchty-windows-x86_64
          path: dist/mitchty-windows-x86_64.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Cachix binary cache
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build macOS binary
        run: nix build .#mitchty-release -L

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp result/bin/mitchty dist/mitchty-darwin-aarch64
          chmod +x dist/mitchty-darwin-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mitchty-darwin-aarch64
          path: dist/mitchty-darwin-aarch64
          if-no-files-found: error

  deploy-next:
    name: Deploy /next/ to GitHub Pages
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [check-linux, check-macos, build-wasm-webgpu-lto, build-wasm-webgl-lto]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGPU wasm
        uses: actions/download-artifact@v4
        with:
          name: wasm-webgpu
          path: _webgpu

      - name: Download WebGL wasm
        uses: actions/download-artifact@v4
        with:
          name: wasm-webgl
          path: _webgl

      - name: Assemble /next/ site tree
        run: |
          mkdir -p _site/next/wasm _site/next/wasm-webgl
          cp -r _webgpu/* _site/next/wasm/
          cp -r _webgl/*  _site/next/wasm-webgl/
          cp index.html   _site/next/index.html
          echo "--- /next/ site layout ---"
          find _site/next -type f | sort

      - name: Deploy /next/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site/next
          destination_dir: next
          keep_files: true
          commit_message: "deploy: /next/ from ${{ github.sha }}"

  deploy-live:
    name: Deploy / (root) to GitHub Pages
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.ref == 'refs/tags/live' }}
    needs: [check-linux, check-macos, build-wasm-webgpu-lto, build-wasm-webgl-lto]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGPU wasm
        uses: actions/download-artifact@v4
        with:
          name: wasm-webgpu
          path: _webgpu

      - name: Download WebGL wasm
        uses: actions/download-artifact@v4
        with:
          name: wasm-webgl
          path: _webgl

      - name: Assemble root site tree
        run: |
          mkdir -p _site/wasm _site/wasm-webgl
          cp -r _webgpu/* _site/wasm/
          cp -r _webgl/*  _site/wasm-webgl/
          cp index.html   _site/index.html
          echo "--- root site layout ---"
          find _site -type f | sort

      - name: Deploy root to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          destination_dir: .
          keep_files: true
          commit_message: "deploy: live from ${{ github.sha }} (tag: live)"

  cleanup-deployments:
    name: Clean Up Old Deployments
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    needs: [deploy-next]
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Delete all deployments except the latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_id=$(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1" --jq '.[0].id')
          gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=100" \
            --jq '.[].id' | \
          while read -r id; do
            if [ "$id" != "$latest_id" ]; then
              gh api -X POST \
                "repos/${{ github.repository }}/deployments/${id}/statuses" \
                -f state=inactive >/dev/null 2>&1 || true
              gh api -X DELETE \
                "repos/${{ github.repository }}/deployments/${id}" \
                >/dev/null 2>&1 || true
            fi
          done

  create-live-release:
    name: Create Live Release
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.ref == 'refs/tags/live' }}
    needs: [deploy-live, build-windows, build-macos]
    runs-on: ubuntu-latest
    env:
       # Just a history of the pages in case I ever need em for god knows why. I
       # can increase this if its not enough but I don't see how it wouldn't be.
       #
       # This is intended to be more like a blog page and the new "releases"
       # include the old content so really only useful for comparison to newer
       # things.
      KEEP_LIVE_RELEASES: "5"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          mkdir -p wasm-dist/wasm wasm-dist/wasm-webgl
          cp -r artifacts/wasm-webgpu/* wasm-dist/wasm/
          cp -r artifacts/wasm-webgl/*  wasm-dist/wasm-webgl/
          cp index.html wasm-dist/
          tar czf release/mitchty-wasm.tar.gz -C wasm-dist .
          cp artifacts/mitchty-windows-x86_64/mitchty-windows-x86_64.exe release/
          cp artifacts/mitchty-darwin-aarch64/mitchty-darwin-aarch64 release/
          ls -lh release/

      - name: Create live release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DATESTAMP="$(date -u +%Y%m%d)"
          RELEASE_TAG="live-${DATESTAMP}-${SHORT_SHA}"
          CARGO_VERSION="$(grep -A5 '\[workspace.package\]' Cargo.toml | grep '^version' | sed 's/version = "\(.*\)"/\1/')"

          gh release create "${RELEASE_TAG}" \
            --title "Live ${DATESTAMP} (v${CARGO_VERSION} @ ${SHORT_SHA})" \
            --notes "Live site release tag commit.

          **Commit:** \`${{ github.sha }}\`
          **Version:** \`${CARGO_VERSION}\`
          **Tag:** \`${RELEASE_TAG}\`

          ### 🌐 WASM (Web)

          **Active/Live site:** [mitchty.github.io](https://mitchty.github.io) from the current \`live\` git tag

          Or download \`mitchty-wasm.tar.gz\` to self-host. The tarball contains both
          \`wasm/\` (WebGPU) and \`wasm-webgl/\` (WebGL fallback) alongside \`index.html\`
          which picks the best available renderer at runtime.

          ### 📦 Native Downloads

          **macOS (Apple Silicon):**
          \`\`\`bash
          curl -Lo mitchty https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/mitchty-darwin-aarch64
          chmod +x mitchty
          ./mitchty
          \`\`\`

          **Windows (x86_64):**
          Download \`mitchty-windows-x86_64.exe\` and run it." \
            release/mitchty-wasm.tar.gz \
            release/mitchty-windows-x86_64.exe \
            release/mitchty-darwin-aarch64

      - name: Prune old live releases (keep newest ${{ env.KEEP_LIVE_RELEASES }})
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only consider versioned snapshot releases (live-YYYYMMDD-SHORTSHA).
          # The mutable 'live' git tag itself has no GitHub release and will
          # never appear here, but we filter to live-* explicitly to be safe.
          gh release list --limit 100 --json tagName,createdAt,isPrerelease \
            | jq -r --argjson keep "$KEEP_LIVE_RELEASES" \
              '[.[] | select(.isPrerelease == false and (.tagName | startswith("live-")))]
               | sort_by(.createdAt) | reverse | .[$keep:][].tagName' \
            | while read -r tag; do
                echo "pruning old live release: ${tag}"
                gh release delete "${tag}" --yes --cleanup-tag || true
              done

  create-prerelease:
    name: Create Pre-Release
    needs: [check-linux, check-macos, build-wasm-webgpu-lto, build-wasm-webgl-lto, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Bundle both wasm builds into one tarball for self-hosting by others
          # just like github or the .#web/.#web-lto derivation apps do.
          mkdir -p wasm-dist/wasm wasm-dist/wasm-webgl
          cp -r artifacts/wasm-webgpu/* wasm-dist/wasm/
          cp -r artifacts/wasm-webgl/*  wasm-dist/wasm-webgl/
          cp index.html wasm-dist/
          tar czf release/mitchty-wasm.tar.gz -C wasm-dist .
          cp artifacts/mitchty-windows-x86_64/mitchty-windows-x86_64.exe release/
          cp artifacts/mitchty-darwin-aarch64/mitchty-darwin-aarch64 release/
          ls -lh release/

      - name: Delete existing pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete the pre-release tag and release if it exists
          if gh release view pre-release >/dev/null 2>&1; then
            echo "Deleting existing pre-release"
            gh release delete pre-release --yes --cleanup-tag
          fi

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create pre-release \
            --title "Latest main" \
            --notes "Automated pre-release build from main branch

          **Commit:** \`${{ github.sha }}\`

          ### 🌐 WASM (Web)

          **Work in progress builds:** [mitchty.github.io/next/](https://mitchty.github.io/next/) latest main commit, may be unstable/broken/angy/sus/sad/buggy etc...

          **Active/Live build:** [mitchty.github.io](https://mitchty.github.io) tagged as \`live\` in git, whatever commit I designate as "good enough to ship as the live site". Not guaranteed to not have bugs just less or not all that important of bugs.

          Or download \`mitchty-wasm.tar.gz\` to self-host. The tarball contains both
          \`wasm/\` (WebGPU) and \`wasm-webgl/\` (WebGL fallback) alongside \`index.html\`
          which picks the best available renderer at runtime.

          ### 📦 Native Downloads

          **macOS (Apple Silicon):**
          \`\`\`bash
          curl -Lo mitchty https://github.com/${{ github.repository }}/releases/download/pre-release/mitchty-darwin-aarch64
          chmod +x mitchty
          ./mitchty
          \`\`\`

          **Windows (x86_64):**
          Download \`mitchty-windows-x86_64.exe\` and run it... somehow?

          ---
          ⚠️ **Note:** These are automated builds from the main development branch, they could be sus.

          Windows builds are cross-compiled and largely untested but here for funsies. Let me know if they work." \
            --prerelease \
            release/mitchty-wasm.tar.gz \
            release/mitchty-windows-x86_64.exe \
            release/mitchty-darwin-aarch64

  record-sizes:
    name: Record Binary Sizes
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.ref == 'refs/tags/live' }}
    needs: [create-live-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Cachix binary cache
        uses: cachix/cachix-action@v15
        with:
          name: ${{ env.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run ci script to record pre-release binary sizes after downloading
        run: |
          nix develop --command ./bin/ci-record-sizes.sh

      - name: Commit build metadata
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .build-meta/
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -n -m "chore: record sizes for ${GITHUB_SHA:0:7} [skip ci]"
            # Always push back to main this job runs off the 'live' tag so
            # GITHUB_REF_NAME would be 'live' which would corrupt the tag when
            # we're only trying to push to the main branch the size data.
            git pull --rebase origin main
            git push origin HEAD:main
          fi

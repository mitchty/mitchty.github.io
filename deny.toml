[graph]
targets = [
  # The triple can be any string, but only the target triples built in to
  # rustc (as of 1.40) can be checked against actual config expressions
  #"x86_64-unknown-linux-musl",
  # You can also specify which target_features you promise are enabled for a
  # particular target. target_features are currently not validated against
  # the actual valid features supported by the target architecture.
  #{ triple = "wasm32-unknown-unknown", features = ["atomics"] },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but no alternative exists yet; no security impact" },
]

[licenses]
allow = [
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT-0",
  "Unicode-3.0",
  "Ubuntu-font-1.0",
  "ISC",
  "OFL-1.1",
  "BlueOak-1.0.0",
  "CC0-1.0",
  "Zlib",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = false
deny = []
skip = [
  # Stuff I don't care that much about or didn't bother looking at the chains
  # cause its windows mostly. As long as it runs its ok. If its a problem future
  # me can deal with it. But looking at a few graphviz chains, its not likely I
  # can fix any of this its all deps of deps.
  "windows",
  "windows-collections",
  "windows-core",
  "windows-future",
  "windows-implement",
  "windows-interface",
  "windows-link",
  "windows-numerics",
  "windows-result",
  "windows-strings",
  "windows-sys",
  "windows-targets",
  "windows-threading",
  "windows_aarch64_gnullvm",
  "windows_aarch64_msvc",
  "windows_i686_gnu",
  "windows_i686_gnullvm",
  "windows_i686_msvc",
  "windows_x86_64_gnu",
  "windows_x86_64_gnullvm",
  "windows_x86_64_msvc",
  # Similar to ^^^ most of this is duplicates from disparate parts of bevy
  # transitive deps. I'm not going to over think these. Some of these dep chains
  # are insane. This is the macos side of the house.
  "objc2",
  "objc2-app-kit",
  "objc2-foundation",
  "core-foundation",
  "core-graphics-types",
  # Linux/android ish related
  "linux-raw-sys",
  "ndk",
  "ndk-sys",
  # Absolute crazy dep chains that I can't be bothered to try to minimize, half of
  # these look like some sorta Jackson Pollock painting
  "bitflags",
  "block2",
  "downcast-rs",
  "nix",
  "read-fonts",
  "rustix",
  "skrifa",
  "thiserror",
  "thiserror-impl",
  # From bevy-pretty-text
  "convert_case",
  # Kinda from wesl in flan, sometimes polars contributes too
  "foldhash",
  "hashbrown",
  "itertools",
  "petgraph",
  "phf_shared",
  "redox_syscall",
  # from polars and/or bevy-fontmesh
  "getrandom",
  "rustc-hash",
  "ttf-parser",
  "r-efi",
]
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []

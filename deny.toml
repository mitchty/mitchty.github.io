[graph]
targets = [
  # The triple can be any string, but only the target triples built in to
  # rustc (as of 1.40) can be checked against actual config expressions
  #"x86_64-unknown-linux-musl",
  # You can also specify which target_features you promise are enabled for a
  # particular target. target_features are currently not validated against
  # the actual valid features supported by the target architecture.
  #{ triple = "wasm32-unknown-unknown", features = ["atomics"] },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained but no alternative exists yet; no security impact" },
  { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained but it is considered complete and not in need of updates" },
]

[licenses]
allow = [
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Ubuntu-font-1.0",
  "ISC",
  "OFL-1.1",
  "BlueOak-1.0.0",
  "CC0-1.0",
  "Zlib",
  "MIT",
  "NCSA",
  "Unlicense",
  "CDLA-Permissive-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

